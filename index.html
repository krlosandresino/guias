<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Registro de guias</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
            user-select: none;
        }

        .card { 
            background: #ffffff; 
            padding: 2rem; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 550px; 
            border: 1px solid #e0e0e0; 
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .contador-badge { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: #2e7d32; 
            color: white; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.85rem; 
            cursor: pointer;
            transition: transform 0.15s;
        }
        .contador-badge:hover {
            transform: scale(1.03);
        }

        .rep-global-tag {
            font-size: 0.7rem;
            background: #ffebee;
            color: #c62828;
            padding: 1px 6px;
            border-radius: 10px;
            margin-left: 5px;
            font-weight: bold;
            display: none;
        }

        .btn-enlace-izq {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #1976D2;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-enlace-izq:hover {
            background: #115293;
        }
        
        h1 { text-align: center; color: #1a1a1a; font-size: 1.5rem; margin-bottom: 1.5rem; }
        
        .marca-agua {
            text-align: center;
            font-size: 0.65rem;
            color: #aaa;
            margin-top: -20px;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .stat-card { 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            padding: 6px 4px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .stat-card:hover {
            background: #eef2f5;
        }
        .stat-card.stat-activa {
            background: #e8f0fe;
            border-color: #1976D2;
            box-shadow: 0 2px 6px rgba(25, 118, 210, 0.15);
        }

        .stat-val { font-size: 1.2rem; font-weight: bold; margin-bottom: 2px; }
        .stat-label { font-size: 0.65rem; font-weight: bold; text-transform: uppercase; color: #666; }
        
        .stat-rep-sub {
            font-size: 0.62rem;
            color: #d32f2f;
            font-weight: 600;
            min-height: 14px;
            margin-top: 2px;
        }

        .btn-clear-mini {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            margin-top: 5px;
            color: #d32f2f;
            padding: 2px 0;
            transition: all 0.2s;
        }
        .btn-clear-mini:hover { background: #fee; border-color: #d32f2f; }

        .val-urbano { color: #f44336; }
        .val-laar { color: #ff9800; }
        .val-servi { color: #4caf50; }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        .input-row { display: flex; gap: 8px; }
        
        input { 
            flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; outline: none; 
        }
        input:focus { border-color: #4caf50; }
        
        input.error-input { 
            border-color: #d32f2f; background-color: #ffebee; animation: shake 0.3s;
        }
        
        .error-msg {
            color: #d32f2f; font-size: 0.75rem; margin-top: -5px; display: none; font-weight: bold;
        }

        .cloud-status {
            font-size: 0.7rem; text-align: center; height: 15px; margin-top: -15px; margin-bottom: 10px; font-weight: bold; color: #999;
        }

        .btn-add { 
            padding: 12px 20px; background-color: #4caf50; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; 
        }

        .barra-herramientas-lista {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }

        .input-buscador {
            flex: 1;
            padding: 7px 10px;
            font-size: 0.8rem;
            border-radius: 6px;
            border: 1px solid #ddd;
            background-color: #fafafa;
        }
        .input-buscador:focus {
            border-color: #1976D2;
            background-color: #fff;
        }

        .badge-filtro-activo {
            display: none;
            align-items: center;
            gap: 5px;
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .actions { display: flex; gap: 8px; margin-top: 20px; }
        .btn-download { flex: 2; padding: 10px; background-color: #1976D2; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-clear { flex: 1; padding: 10px; background-color: #f5f5f5; color: #d32f2f; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        
        #listaGuias { 
            display: flex; flex-direction: column; gap: 8px; margin-top: 12px; border-top: 1px solid #eee; padding-top: 15px; max-height: 350px; overflow-y: auto; 
        }

        .guia-item { 
            display: grid; grid-template-columns: 145px 1fr 155px; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 0.85rem; border: 1px solid #eee; 
        }

        .badge-courier {
            font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; width: 80px; text-align: center;
        }

        .courier-urbano { background-color: #f44336; }
        .courier-laar { background-color: #ff9800; }
        .courier-servi { background-color: #4caf50; }

        .hora-texto { color: #888; font-size: 0.75rem; text-align: center; }
        .guia-texto { font-weight: bold; display: flex; align-items: center; gap: 6px; }
        
        .sync-indicator {
            font-size: 0.72rem;
            font-family: 'Segoe UI', sans-serif;
        }

        .btn-delete {
            background: none; border: none; color: #d32f2f; cursor: pointer; font-size: 1.1rem; padding: 0 5px; transition: transform 0.1s;
        }
        .btn-delete:hover { transform: scale(1.2); }

        .badge-repetida {
            background-color: #d32f2f; color: white; font-size: 0.6rem; padding: 1px 4px; border-radius: 4px; font-weight: bold; margin-right: 5px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

<div class="card">
    <a href="https://drive.google.com/drive/folders/1rN2tFVe7ayAmvZYVucfhD2HPzBEbs5Xa" target="_blank" class="btn-enlace-izq">📂 Ver Guías Pitadas</a>
    <div class="contador-badge" onclick="filtrarPorCourier(null)" title="Mostrar todas las guías">
        TOTAL: <span id="numContador">0</span><span id="repTotalBadge" class="rep-global-tag">0 REP</span>
    </div>
    <h1>📦 Pitado de pedidos</h1>
    <div class="marca-agua">© 2026 Desarrollado por Carlos Burgos</div>

    <div class="stats-container">
        <div class="stat-card" id="card-urbano" onclick="filtrarPorCourier('URBANO', event)" title="Clic para filtrar Urbano">
            <span class="stat-val val-urbano" id="stat-urbano">0</span>
            <span class="stat-label">Urbano</span>
            <span class="stat-rep-sub" id="rep-urbano"></span>
            <button class="btn-clear-mini" onclick="limpiarCourier('URBANO')">Limpiar</button>
        </div>
        <div class="stat-card" id="card-laar" onclick="filtrarPorCourier('LAAR', event)" title="Clic para filtrar Laar">
            <span class="stat-val val-laar" id="stat-laar">0</span>
            <span class="stat-label">Laar</span>
            <span class="stat-rep-sub" id="rep-laar"></span>
            <button class="btn-clear-mini" onclick="limpiarCourier('LAAR')">Limpiar</button>
        </div>
        <div class="stat-card" id="card-servi" onclick="filtrarPorCourier('SERVIENTREGA', event)" title="Clic para filtrar Servientrega">
            <span class="stat-val val-servi" id="stat-servi">0</span>
            <span class="stat-label">Servi</span>
            <span class="stat-rep-sub" id="rep-servi"></span>
            <button class="btn-clear-mini" onclick="limpiarCourier('SERVIENTREGA')">Limpiar</button>
        </div>
    </div>
    
    <div class="input-group">
        <div class="input-row">
            <input type="text" id="nuevaGuia" placeholder="Escanee guía aquí..." autofocus autocomplete="off">
            <button class="btn-add" onclick="agregarGuia()">Añadir</button>
        </div>
        <span id="mensajeError" class="error-msg">❌ Guía INVÁLIDA (Revisar Courier)</span>
    </div>
    
    <div id="statusNube" class="cloud-status">Esperando datos...</div>

    <div class="barra-herramientas-lista">
        <input type="text" id="buscadorGuia" class="input-buscador" placeholder="🔍 Buscar guía escaneada..." oninput="filtrarPorTexto()" autocomplete="off">
        <div id="badgeFiltroCourier" class="badge-filtro-activo" onclick="filtrarPorCourier(null)" title="Quitar filtro">
            <span id="txtFiltroCourier"></span> ✖
        </div>
    </div>

    <div id="listaGuias"></div>

    <div class="actions">
        <button class="btn-download" onclick="descargarExcel()">📊 Descargar Excel</button>
        <button class="btn-clear" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
    </div>
</div>

<script>
    const URL_GOOGLE_SHEET = "https://script.google.com/macros/s/AKfycbzXMgPjNaY0LrZNXPyzDgNcI9Zfdmnfj8nMUVNBv-roS4KYestgXWElx4jwqoE2pwv0tA/exec";

    let datosGuias = [];
    let guiasUnicasSet = new Set(); // Búsqueda O(1) instantánea
    const enviandoSet = new Set();  // Blindaje contra envíos duplicados en paralelo
    let sincronizandoCola = false;  // Candado de cola offline

    let filtroCourierActivo = null;
    let textoBusquedaActivo = "";

    const input = document.getElementById('nuevaGuia');
    const inputBuscador = document.getElementById('buscadorGuia');
    const contenedor = document.getElementById('listaGuias');
    const txtContador = document.getElementById('numContador');
    const repTotalBadge = document.getElementById('repTotalBadge');
    const sUrbano = document.getElementById('stat-urbano');
    const sLaar = document.getElementById('stat-laar');
    const sServi = document.getElementById('stat-servi');
    const rUrbano = document.getElementById('rep-urbano');
    const rLaar = document.getElementById('rep-laar');
    const rServi = document.getElementById('rep-servi');
    const statusNube = document.getElementById('statusNube');
    const badgeFiltroCourier = document.getElementById('badgeFiltroCourier');
    const txtFiltroCourier = document.getElementById('txtFiltroCourier');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // --- DESBLOQUEO DE CONTEXTO DE AUDIO ---
    function iniciarAudio() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    document.addEventListener('click', iniciarAudio, { once: true });
    document.addEventListener('keydown', iniciarAudio, { once: true });

    window.onload = function() {
        const guardado = localStorage.getItem('misGuias');
        if (guardado) {
            datosGuias = JSON.parse(guardado);
            reconstruirSet();
            renderizarLista();
            actualizarContador();
        }
        // Iniciar revisión de pendientes offline al cargar
        setTimeout(sincronizarPendientes, 2000);
    };

    // Reconexión automática inmediata al detectar internet
    window.addEventListener('online', () => {
        statusNube.innerText = "🌐 Conexión restablecida. Sincronizando...";
        statusNube.style.color = "#1976D2";
        sincronizarPendientes();
    });

    function reconstruirSet() {
        guiasUnicasSet = new Set(datosGuias.map(g => g.Guia));
    }

    function sonar(frecuencia, tipo, duracion, volumen) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = tipo;
        oscillator.frequency.setValueAtTime(frecuencia, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(volumen, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duracion);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duracion);
    }

    function sonarRepetida() {
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        sonar(600, 'square', 0.2, 0.1);
        setTimeout(() => sonar(600, 'square', 0.2, 0.1), 150);
    }

    function sonarInvalida() {
        if (navigator.vibrate) navigator.vibrate(400);
        sonar(100, 'sawtooth', 0.6, 0.3);
    }

    function sonarOk() { sonar(800, 'sine', 0.1, 0.05); }

    function guardarEnStorage() {
        localStorage.setItem('misGuias', JSON.stringify(datosGuias));
    }

    function actualizarIndicadorFila(datos) {
        const idxReal = datosGuias.indexOf(datos);
        if (idxReal === -1) return;
        const iconoEl = document.getElementById(`sync-ind-${idxReal}`);
        if (iconoEl) {
            iconoEl.innerText = datos.Sincronizado ? "☁️" : "⏳";
            iconoEl.title = datos.Sincronizado ? "Sincronizado en la nube" : "Pendiente de subir a la nube";
        }
    }

    function enviarANube(datos) {
        if (!URL_GOOGLE_SHEET) return;
        statusNube.innerText = "☁️ Enviando a la nube...";
        statusNube.style.color = "#1976D2";
        
        datos.Sincronizado = false;
        enviandoSet.add(datos); // Bloquea el registro para que el intervalo no lo duplique

        fetch(URL_GOOGLE_SHEET, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            enviandoSet.delete(datos);
            statusNube.innerText = "✅ Guardado en la nube";
            statusNube.style.color = "green";
            datos.Sincronizado = true;
            guardarEnStorage();
            actualizarIndicadorFila(datos);
            setTimeout(() => {
                if (!sincronizandoCola) {
                    statusNube.innerText = "Esperando datos...";
                    statusNube.style.color = "#999";
                }
            }, 2000);
        })
        .catch(error => {
            enviandoSet.delete(datos);
            console.error('Error:', error);
            statusNube.innerText = "❌ Guardado local (Pendiente de nube)";
            statusNube.style.color = "red";
            datos.Sincronizado = false;
            guardarEnStorage();
            actualizarIndicadorFila(datos);
        });
    }

    // --- COLA DE SINCRONIZACIÓN OFFLINE BLINDADA ---
    function sincronizarPendientes() {
        if (sincronizandoCola || !navigator.onLine) return;

        const pendientes = datosGuias.filter(g => g.Sincronizado === false && !enviandoSet.has(g));
        if (pendientes.length === 0) return;
        
        sincronizandoCola = true;
        statusNube.innerText = `☁️ Sincronizando ${pendientes.length} pendientes...`;
        statusNube.style.color = "#ff9800";
        
        const guiaSinc = pendientes[0];
        enviandoSet.add(guiaSinc);
        
        fetch(URL_GOOGLE_SHEET, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(guiaSinc)
        })
        .then(() => {
            enviandoSet.delete(guiaSinc);
            guiaSinc.Sincronizado = true;
            guardarEnStorage();
            actualizarIndicadorFila(guiaSinc);
            statusNube.innerText = `✅ Pendiente sincronizada...`;
            statusNube.style.color = "green";
            setTimeout(() => {
                sincronizandoCola = false;
                sincronizarPendientes();
            }, 1000);
        })
        .catch(err => {
            enviandoSet.delete(guiaSinc);
            sincronizandoCola = false;
            statusNube.innerText = "❌ Esperando conexión para sincronizar...";
            statusNube.style.color = "red";
        });
    }

    // Revisa si hay envíos pendientes cada 15 segundos
    setInterval(sincronizarPendientes, 15000);

    function eliminarGuia(indexVisual) {
        if (confirm("¿Eliminar este registro localmente? (No se borrará de la nube)")) {
            const indexReal = datosGuias.length - 1 - indexVisual;
            if (indexReal >= 0 && indexReal < datosGuias.length) {
                datosGuias.splice(indexReal, 1);
                reconstruirSet();
                guardarEnStorage();
                renderizarLista();
                actualizarContador();
            }
        }
    }

    function limpiarCourier(courier) {
        const cantidad = datosGuias.filter(g => g.Courier === courier).length;
        if (cantidad === 0) return;

        if (confirm(`¿Seguro que quieres borrar localmente las ${cantidad} guías de ${courier}?`)) {
            datosGuias = datosGuias.filter(g => g.Courier !== courier);
            if (filtroCourierActivo === courier) filtroCourierActivo = null;
            reconstruirSet();
            guardarEnStorage();
            actualizarUIEstadoFiltro();
            renderizarLista();
            actualizarContador();
            input.focus();
        }
    }

    function cumpleFiltros(g) {
        if (filtroCourierActivo && g.Courier !== filtroCourierActivo) return false;
        if (textoBusquedaActivo && !g.Guia.includes(textoBusquedaActivo)) return false;
        return true;
    }

    function crearNodoGuia(g, indexReal) {
        const indexVisual = datosGuias.length - 1 - indexReal;
        const div = document.createElement('div');
        div.className = 'guia-item';
        
        let courierClass = '';
        if (g.Courier === 'URBANO') courierClass = 'courier-urbano';
        if (g.Courier === 'LAAR') courierClass = 'courier-laar';
        if (g.Courier === 'SERVIENTREGA') courierClass = 'courier-servi';

        const syncIcon = g.Sincronizado ? '☁️' : '⏳';
        const syncTitle = g.Sincronizado ? 'Sincronizado en la nube' : 'Pendiente de subir a la nube';

        div.innerHTML = `
            <div class="guia-texto">
                <span id="sync-ind-${indexReal}" class="sync-indicator" title="${syncTitle}">${syncIcon}</span>
                <span>${g.Guia}</span>
            </div>
            <div class="hora-texto">${g.Hora}</div>
            <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px;">
                ${g.Estado === "REPETIDA" ? '<span class="badge-repetida">REP</span>' : ''}
                <span class="badge-courier ${courierClass}">${g.Courier}</span>
                <button class="btn-delete" onclick="eliminarGuia(${indexVisual})" title="Borrar">🗑️</button>
            </div>
        `;
        return div;
    }

    function renderizarLista() {
        contenedor.innerHTML = "";
        const fragment = document.createDocumentFragment();
        for (let i = datosGuias.length - 1; i >= 0; i--) {
            const g = datosGuias[i];
            if (cumpleFiltros(g)) {
                fragment.appendChild(crearNodoGuia(g, i));
            }
        }
        contenedor.appendChild(fragment);
    }

    // Inserción incremental O(1) en el DOM sin reconstruir toda la lista
    function insertarGuiaDOMIncremental(nuevaData, indexReal) {
        if (!cumpleFiltros(nuevaData)) return;
        const nuevoNodo = crearNodoGuia(nuevaData, indexReal);
        contenedor.prepend(nuevoNodo);
    }

    // Conteo en una sola pasada (Unicas vs Repetidas para auditoría)
    function actualizarContador() {
        let uUnicas = 0, lUnicas = 0, sUnicas = 0;
        let uRep = 0, lRep = 0, sRep = 0;

        for (let i = 0; i < datosGuias.length; i++) {
            const g = datosGuias[i];
            const esRep = g.Estado === "REPETIDA";
            if (g.Courier === 'URBANO') {
                if (esRep) uRep++; else uUnicas++;
            } else if (g.Courier === 'LAAR') {
                if (esRep) lRep++; else lUnicas++;
            } else if (g.Courier === 'SERVIENTREGA') {
                if (esRep) sRep++; else sUnicas++;
            }
        }

        const totalUnicas = uUnicas + lUnicas + sUnicas;
        const totalRep = uRep + lRep + sRep;

        txtContador.textContent = totalUnicas;
        sUrbano.textContent = uUnicas;
        sLaar.textContent = lUnicas;
        sServi.textContent = sUnicas;

        if (totalRep > 0) {
            repTotalBadge.style.display = "inline-block";
            repTotalBadge.textContent = `+${totalRep} REP`;
        } else {
            repTotalBadge.style.display = "none";
        }

        rUrbano.textContent = uRep > 0 ? `(${uRep} rep)` : "";
        rLaar.textContent = lRep > 0 ? `(${lRep} rep)` : "";
        rServi.textContent = sRep > 0 ? `(${sRep} rep)` : "";
    }

    function filtrarPorCourier(courier, event) {
        if (event && event.target.closest('.btn-clear-mini')) return;
        if (filtroCourierActivo === courier || courier === null) {
            filtroCourierActivo = null;
        } else {
            filtroCourierActivo = courier;
        }
        actualizarUIEstadoFiltro();
        renderizarLista();
        input.focus();
    }

    function filtrarPorTexto() {
        textoBusquedaActivo = inputBuscador.value.trim().toUpperCase();
        renderizarLista();
    }

    function actualizarUIEstadoFiltro() {
        document.getElementById('card-urbano').classList.toggle('stat-activa', filtroCourierActivo === 'URBANO');
        document.getElementById('card-laar').classList.toggle('stat-activa', filtroCourierActivo === 'LAAR');
        document.getElementById('card-servi').classList.toggle('stat-activa', filtroCourierActivo === 'SERVIENTREGA');

        if (filtroCourierActivo) {
            badgeFiltroCourier.style.display = 'flex';
            txtFiltroCourier.textContent = `Filtro: ${filtroCourierActivo}`;
        } else {
            badgeFiltroCourier.style.display = 'none';
        }
    }

    function validarGuia(valor) {
        if (!/^\d+$/.test(valor)) return null; // Validación numérica estricta
        if (valor.length === 11 && valor.startsWith("41")) return "URBANO";
        if (valor.length === 10 && valor.startsWith("20")) return "LAAR";
        if (valor.length === 9 && valor.startsWith("81")) return "SERVIENTREGA";
        return null;
    }

    function agregarGuia() {
        const valor = input.value.trim().toUpperCase();
        if (valor === "") return;

        const courierIdentificado = validarGuia(valor);

        if (!courierIdentificado) {
            sonarInvalida();
            document.getElementById('mensajeError').style.display = "block";
            input.classList.add('error-input');
            setTimeout(() => {
                input.classList.remove('error-input');
                document.getElementById('mensajeError').style.display = "none";
            }, 1500);
            input.value = ""; 
            return;
        }

        const existe = guiasUnicasSet.has(valor);
        const ahora = new Date();
        const fechaLimpia = ahora.toLocaleDateString();
        const horaLimpia = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let nuevaData = { 
            "Guia": valor, 
            "Courier": courierIdentificado, 
            "Fecha": fechaLimpia, 
            "Hora": horaLimpia, 
            "Estado": "NUEVA",
            "Sincronizado": false
        };

        if (existe) {
            sonarRepetida();
            input.classList.add('error-input');
            setTimeout(() => input.classList.remove('error-input'), 500);
            nuevaData.Estado = "REPETIDA";
            datosGuias.push(nuevaData);
        } else {
            sonarOk();
            guiasUnicasSet.add(valor);
            datosGuias.push(nuevaData);
        }
        
        const nuevoIndexReal = datosGuias.length - 1;
        enviarANube(nuevaData);
        guardarEnStorage(); 
        insertarGuiaDOMIncremental(nuevaData, nuevoIndexReal);
        actualizarContador();
        input.value = "";
        input.focus();
    }

    function descargarExcel() {
        if (datosGuias.length === 0) return alert("No hay guías para descargar");
        const ahora = new Date();
        const nombreArchivo = `Reporte_Guias_${ahora.getFullYear()}-${ahora.getMonth()+1}-${ahora.getDate()}.xlsx`;
        
        const datosLimpios = datosGuias.map((g, idx) => ({
            "N°": idx + 1,
            "Guia": g.Guia,
            "Courier": g.Courier,
            "Fecha": g.Fecha,
            "Hora": g.Hora,
            "Estado": g.Estado,
            "Respaldo Nube": g.Sincronizado ? "En Nube" : "Local"
        }));

        const ws = XLSX.utils.json_to_sheet(datosLimpios);
        ws['!cols'] = [
            { wch: 6 },
            { wch: 16 },
            { wch: 15 },
            { wch: 12 },
            { wch: 10 },
            { wch: 12 },
            { wch: 14 }
        ];

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Reporte");
        XLSX.writeFile(wb, nombreArchivo);
    }

    function limpiarTodo() {
        if (confirm("¿Seguro que quieres borrar todo el trabajo actual LOCALMENTE? (La nube no se borrará)")) {
            datosGuias = [];
            guiasUnicasSet.clear();
            filtroCourierActivo = null;
            textoBusquedaActivo = "";
            inputBuscador.value = "";
            localStorage.removeItem('misGuias');
            actualizarUIEstadoFiltro();
            renderizarLista();
            actualizarContador();
            input.focus();
        }
    }

    // --- LÓGICA PROTEGIDA (SOLO CON ENTER DEL ESCÁNER) ---
    input.addEventListener("keypress", (e) => { 
        if (e.key === "Enter") {
            agregarGuia(); 
        }
    });

    // --- BLOQUE DE SEGURIDAD AÑADIDO ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || (e.shiftKey && (e.key === "I" || e.key === "J"))))) {
            e.preventDefault();
            return false;
        }
    });
</script>
</body>
</html>
